<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Vardo's mark: a Romani wagon seen end-on. The barrel-vaulted roof, the eaves
    it overhangs by, and a door.

    It replaces a padlock, which is what every password manager uses and which
    says only "this is about security" - true of a firewall and an antivirus
    too. A vardo is a home you carry with you, which is the actual idea: a vault
    that travels between your machines rather than living on a server.

    Same geometry as the in-app mark, on the Telegram accent darkened to the
    behind-text variant so the cut-out door stays legible at 32px.
  -->
  <rect width="512" height="512" rx="112" fill="#1b7db7"/>
  <g transform="translate(96,96) scale(2.667)">
    <path
      fill="#ffffff"
      fill-rule="evenodd"
      d="M 18 100 L 18 46 A 42 42 0 0 1 102 46 L 102 100 Z
         M 46 100 L 46 74 A 14 14 0 0 1 74 74 L 74 100 Z"/>
    <rect x="4" y="38" width="112" height="11" rx="5.5" fill="#ffffff"/>
  </g>
</svg>
