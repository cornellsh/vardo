version: 2

# Weekly, and grouped, so updates arrive as a few reviewable pull requests
# rather than a stream of one-line bumps that get merged without being read.
# Security updates are not batched: GitHub opens those as soon as an advisory
# is published, regardless of this schedule.

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # RustCrypto crates share trait crates (cipher, digest), so a new release
      # only compiles when every one of them moves at once. First match wins,
      # so this sits above the catch-all.
      rustcrypto:
        patterns: [aes, cbc, chacha20, salsa20, twofish, sha1, sha2, hmac, argon2, cipher, digest]
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      interface:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    groups:
      extension:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
