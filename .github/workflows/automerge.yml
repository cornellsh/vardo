# Merges Dependabot's pull requests once the checks that main requires pass.
# Major version bumps wait for a person (dec:dependabot-automerge).
# yamllint disable rule:line-length
name: Dependabot

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Merge when green
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # --auto queues the merge; GitHub performs it once the required checks
      # pass, and never if one fails.
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
