[workspace]
# "3" picks dependency versions that support `rust-version`, so `cargo add`
# cannot quietly pull in a release that needs a newer compiler. It did once:
# the global-shortcut plugin dragged Tauri to a version needing Rust 1.90.
resolver = "3"
members = [
  "crates/vardo-kdbx",
  "crates/vardo-vault",
  "crates/vardo-merge",
  "crates/vardo-sync",
  "crates/vardo-drive",
  "crates/vardo-conformance",
  "crates/vardo-core",
  "crates/vardo-browser",
  "app/src-tauri",
  "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Vardo needs 1.89, for `File::try_lock` (crates/vardo-core/src/session/instance.rs).
# Dependencies need 1.88: the ICU Unicode tables behind URL parsing and
# `darling` behind Tauri.
#
# This said 1.83 for a long time without anyone checking, and 1.83 cannot even
# read the dependency manifests. CI now builds with exactly this version, so
# the next time a dependency raises it the build says so.
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/cornellsh/vardo"

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
salsa20 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
getrandom = "0.3"
thiserror = "2"
twofish = "0.7"
zeroize = { version = "1", features = ["derive"] }

# Key derivation runs millions of rounds per unlock. Unoptimised, it makes the
# test suite several times slower; our own crates stay debuggable.
[profile.dev.package]
aes.opt-level = 3
argon2.opt-level = 3
blake2.opt-level = 3
cbc.opt-level = 3
chacha20.opt-level = 3
hmac.opt-level = 3
miniz_oxide.opt-level = 3
salsa20.opt-level = 3
sha2.opt-level = 3
twofish.opt-level = 3
