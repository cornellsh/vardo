[workspace]
resolver = "2"
members = [
  "crates/vardo-kdbx",
  "crates/vardo-vault",
  "crates/vardo-merge",
  "crates/vardo-sync",
  "crates/vardo-drive",
  "crates/vardo-conformance",
  "crates/vardo-core",
  "app/src-tauri",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# 1.83 for `io::ErrorKind::StorageFull`, which lets a failed save distinguish
# "free up some space" from every other IO failure. Detecting it via a raw
# errno would avoid the bump but needs libc, and a 2024 compiler floor is not a
# meaningful constraint here.
rust-version = "1.83"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/vardo/vardo"

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
salsa20 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
getrandom = "0.3"
thiserror = "2"
twofish = "0.7"
zeroize = { version = "1", features = ["derive"] }
