[workspace]
resolver = "2"
members = [
  "crates/vardo-kdbx",
  "crates/vardo-vault",
  "crates/vardo-merge",
  "crates/vardo-sync",
  "crates/vardo-drive",
  "crates/vardo-conformance",
  "crates/vardo-core",
  "app/src-tauri",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Set by dependencies, not by Vardo's own code: the ICU Unicode tables behind
# URL parsing and `darling` behind Tauri both require 1.88. Vardo itself needs
# 1.83, for `io::ErrorKind::StorageFull`.
#
# This said 1.83 for a long time without anyone checking, and 1.83 cannot even
# read the dependency manifests. CI now builds with exactly this version, so
# the next time a dependency raises it the build says so.
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/cornellsh/vardo"

[workspace.dependencies]
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
salsa20 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
getrandom = "0.3"
thiserror = "2"
twofish = "0.7"
zeroize = { version = "1", features = ["derive"] }
