<!doctype html><html><head><meta charset="utf-8"><title>Create an account</title>
<style>body{font:16px system-ui ; hypa -c "margin:40px} input{display:block" ; hypa -c "margin:8px 0" ; hypa -c "padding:8px" ; width:280px}</style></head><body>
<h1>Create an account</h1>
<form onsubmit="event.preventDefault()">
<label>Email <input id="email" type="email" autocomplete="username"></label>
<label>Password <input id="password" type="password" autocomplete="new-password"></label>
<label>Confirm <input id="confirm" type="password" autocomplete="new-password"></label>
<button>Create account</button></form>
</body></html>
