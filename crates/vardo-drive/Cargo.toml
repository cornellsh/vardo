[package]
name = "vardo-drive"
description = "Google Drive storage backend and installed-app OAuth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The real HTTP client. Off by default so the logic can be built and tested
# without pulling in TLS and a networking stack.
default = []
network = ["dep:ureq"]

# Live contract tests against a real Drive account. Needs a real HTTP client,
# so it is gated — otherwise a default-feature build of all targets fails on the
# missing `ureq_transport` module.
[[example]]
name = "contract"
required-features = ["network"]

[dependencies]
vardo-kdbx = { path = "../vardo-kdbx" }
vardo-sync = { path = "../vardo-sync" }
sha2.workspace = true
ureq = { version = "3", optional = true }
