[package]
name = "vardo-browser"
description = "What the desktop app and the browser extension's native host share: the protocol, URL matching and the local socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately small. The native host links this crate and nothing else from
# Vardo, so Chrome never starts a process that contains vault code.

[dependencies]
psl = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[[bin]]
name = "vardo-browser-host"
path = "src/bin/host.rs"
