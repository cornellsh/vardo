[package]
name = "vardo-core"
description = "Everything the desktop app does, with no dependency on the UI toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vardo-kdbx = { path = "../vardo-kdbx" }
vardo-vault = { path = "../vardo-vault" }
vardo-merge = { path = "../vardo-merge" }
vardo-sync = { path = "../vardo-sync" }
vardo-browser = { path = "../vardo-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vardo-drive = { path = "../vardo-drive", features = ["network"] }
vardo-webdav = { path = "../vardo-webdav", features = ["network"] }
hmac.workspace = true
sha2.workspace = true
sha1 = "0.10"
getrandom.workspace = true
zeroize.workspace = true
# The Drive refresh token goes to the OS credential store (drive/tokens.rs).
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2"
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Pure Rust D-Bus, so Linux builds need no libdbus.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
# An in-memory credential store, so no test touches a real keychain.
keyring-core = { version = "1", features = ["sample"] }
# Only for asserting that no secret reaches the serialised form.
serde_json = "1"
vardo-browser = { path = "../vardo-browser" }
# Generates app/src/ipc/bindings.ts from the view models; test builds only.
ts-rs = "12"
